<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Robot LiDAR Sim</title>
<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
  }

  #layout {
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 0;
  }

  #stage {
    display: flex;
    flex-direction: column;
    width: 50vw;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    background: white;
    flex-shrink: 0;
  }

  #toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 6px;
  }

  canvas#board {
    display: block;
    box-sizing: border-box;
    width: 100%;
    flex: 1 1 0;
    min-height: 0;
    object-fit: contain;
    border: 1px solid black;
  }

  #fs-btn {
    width: 36px;
    height: 36px;
    padding: 6px;
    background: white;
    border: 1px solid black;
    cursor: pointer;
  }
  #fs-btn svg { display: block; }
  #fs-btn .icon-minimize { display: none; }

  #stage:fullscreen canvas#board { border: 0; }
  #stage:fullscreen #fs-btn .icon-maximize { display: none; }
  #stage:fullscreen #fs-btn .icon-minimize { display: block; }

  footer {
    position: fixed;
    right: 8px;
    bottom: 4px;
    font-size: 12px;
    color: #666;
  }

  @media (max-width: 900px) {
    #layout { flex-direction: column; }
    #stage { width: 100%; height: auto; }
    canvas#board { flex: none; height: auto; }
    footer { position: static; text-align: center; padding: 10px; }
  }
</style>
</head>
<body>
<div id="layout">

  <!-- ===================== GAME (left / top on mobile) ===================== -->
  <div id="stage">
    <div id="toolbar">
      <button id="fs-btn" type="button" title="Fullscreen" aria-label="Fullscreen">
        <svg class="icon-maximize" viewBox="0 0 24 24" width="100%" height="100%" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
        </svg>
        <svg class="icon-minimize" viewBox="0 0 24 24" width="100%" height="100%" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
        </svg>
      </button>
    </div>

    <canvas id="board" width="960" height="1080"></canvas>
  </div>

</div>

<footer>Developed by Merlin2LmmL (ortnermerlin@gmail.com) in 2026</footer>

<!-- ===================== FULLSCREEN ===================== -->
<script>
(() => {
  const stage = document.getElementById("stage");
  const fsBtn = document.getElementById("fs-btn");

  fsBtn.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await stage.requestFullscreen();
      }
    } catch (err) {
      console.error("Fullscreen failed:", err);
    }
  });

  document.addEventListener("fullscreenchange", () => {
    const full = document.fullscreenElement === stage;
    const label = full ? "Exit fullscreen" : "Fullscreen";
    fsBtn.title = label;
    fsBtn.setAttribute("aria-label", label);
  });
})();
</script>

<script type="module" src="src/main.js"></script>
</body>
</html>
